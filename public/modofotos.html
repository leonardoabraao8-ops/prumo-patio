<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Fotos de entrada · Prumo</title>
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
/* =========================================================
   MODO FOTOS
   Ferramenta do guincheiro: vê só placa e modelo dos carros não
   entregues e tira as fotos de entrada. Não lê nem muda mais nada
   do pátio — o banco só deixa acrescentar foto (registrar_foto).

   Fluxo enxuto, sem telas no meio: escolheu o carro, a câmera já
   abre dentro da página; em cima, um ícone pequeno mostra de onde
   tirar; um toque fotografa e já pula para o próximo ângulo. No
   fim, uma tela só para revisar e aprovar — só aí sobe tudo.
   ========================================================= */
:root{
  --fundo:#F4F3EF; --cartao:#FFFFFF; --tinta:#111; --tinta-2:#555; --linha:#DDDAD2;
  --verde:#1F8F4E; --verde-claro:#DDF3E6; --laranja:#D9730D; --vermelho:#C62828; --azul:#0B3A8C;
  --raio:18px;
}
@media (prefers-color-scheme: dark){
  :root{ --fundo:#111; --cartao:#1C1C1C; --tinta:#F2F2F2; --tinta-2:#AAA; --linha:#333;
    --verde:#3DBE72; --verde-claro:#163A25; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--tinta);
  font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.oculto{display:none !important}
.tela{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
header.topo{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;z-index:5;
  background:var(--fundo);border-bottom:1px solid var(--linha)}
header.topo h1{font-size:19px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;cursor:pointer;min-height:52px}
.btn-p{background:var(--tinta);color:var(--fundo)}
.btn-v{background:var(--verde);color:#fff}
.btn-s{background:var(--cartao);border:1.5px solid var(--linha)}
.btn-l{background:none;padding:10px 12px;min-height:44px;color:var(--tinta-2)}
.btn:disabled{opacity:.5}
.btn-grande{width:100%;font-size:20px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px}
.voltar{font-size:24px;line-height:1;width:44px;height:44px;border-radius:12px;border:0;background:var(--cartao);cursor:pointer}

/* entrar */
.entrar{max-width:420px;margin:12vh auto 0;padding:0 20px}
.entrar h1{font-size:26px;margin:0 0 4px}
.entrar p{color:var(--tinta-2);margin:0 0 22px}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-size:14px;color:var(--tinta-2);margin-bottom:6px}
.campo input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--linha);background:var(--cartao);font-size:18px}
.erro{color:var(--vermelho);font-size:15px;min-height:22px;margin:4px 0 10px}

/* lista */
.busca{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--linha);background:var(--cartao);font-size:18px;margin:4px 0 14px}
.carro{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--cartao);border:1.5px solid var(--linha);
  border-radius:var(--raio);padding:14px;margin-bottom:10px;cursor:pointer}
.carro .info{flex:1;min-width:0}
.carro .modelo{font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carro .falta{font-size:15px;color:var(--laranja);font-weight:600;margin-top:2px}
.carro.completo .falta{color:var(--verde)}
.carro .seta{font-size:26px;color:var(--tinta-2)}
.placa{display:inline-flex;flex-direction:column;border:2px solid #111;border-radius:7px;overflow:hidden;background:#fff;color:#111;flex-shrink:0;min-width:96px}
.placa .br{background:var(--azul);color:#fff;font-size:8px;letter-spacing:.2em;text-align:center;font-weight:700;padding:1px 0}
.placa .num{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:700;font-size:19px;letter-spacing:.06em;text-align:center;padding:2px 8px 3px}
.vazio{text-align:center;color:var(--tinta-2);padding:40px 10px}
.secao{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin:18px 2px 8px;font-weight:600}

/* câmera em tela cheia */
#t-camera{position:fixed;inset:0;background:#000;color:#fff;z-index:10;display:flex;flex-direction:column}
#t-camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-topo{position:relative;z-index:2;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0))}
.cam-topo .ico{width:56px;height:56px;flex-shrink:0;background:rgba(255,255,255,.95);border-radius:14px;padding:4px;color:#111}
.cam-topo .ico svg{width:100%;height:100%;display:block}
.cam-topo .txt{flex:1;min-width:0;line-height:1.2}
.cam-topo .txt b{display:block;font-size:20px}
.cam-topo .txt small{font-size:14px;opacity:.85}
.cam-topo button{background:rgba(255,255,255,.18);border:0;border-radius:12px;color:#fff;padding:10px 12px;font-weight:600;min-height:44px}
.cam-baixo{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6))}
.disparo{width:82px;height:82px;border-radius:99px;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;padding:0}
.disparo:active{background:#fff}
.cam-ultima{width:58px;height:58px;border-radius:12px;background:rgba(255,255,255,.15);overflow:hidden;border:2px solid #fff;padding:0}
.cam-ultima img{width:100%;height:100%;object-fit:cover;display:block}
.cam-cont{width:58px;text-align:center;font-weight:700;font-size:18px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3;transition:opacity .25s}
.flash.ativo{opacity:.85;transition:none}
.cam-erro{position:relative;z-index:2;margin:auto 20px;text-align:center;background:rgba(0,0,0,.6);padding:20px;border-radius:16px}

/* revisão */
.revisao h2{margin:4px 0 2px;font-size:22px}
.revisao p{margin:0 0 14px;color:var(--tinta-2)}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.foto{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--cartao);border:1.5px dashed var(--linha);
  display:flex;align-items:center;justify-content:center;text-align:center;color:var(--tinta-2);cursor:pointer;padding:0}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto .rot{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7));color:#fff;
  font-size:13px;font-weight:600;padding:16px 8px 6px;text-align:left}
.foto.vazia .rot{position:static;background:none;color:var(--tinta-2);padding:0 8px}
.foto .refazer{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;font-size:12px;padding:4px 8px;font-weight:600}
.foto .selo{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px}
.selo.ok{background:var(--verde)} .selo.ind{background:var(--laranja)} .selo.err{background:var(--vermelho)}
.acoes-fim{position:sticky;bottom:0;background:var(--fundo);padding:14px 0 calc(6px + env(safe-area-inset-bottom));margin-top:14px;display:flex;flex-direction:column;gap:10px}
.recado{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;
  padding:12px 18px;border-radius:14px;font-size:16px;max-width:calc(100% - 32px);z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.3)}
</style>
</head>
<body>

<!-- ENTRAR -->
<section id="t-entrar" class="entrar oculto">
  <h1>Fotos de entrada</h1>
  <p>Prumo · entre com o mesmo e-mail e senha do aplicativo de abastecimento.</p>
  <form id="f-entrar">
    <label class="campo"><span>E-mail</span><input id="e-email" type="email" autocomplete="username" inputmode="email" required></label>
    <label class="campo"><span>Senha</span><input id="e-senha" type="password" autocomplete="current-password" required></label>
    <div class="erro" id="e-erro"></div>
    <button class="btn btn-p btn-grande" type="submit" id="e-botao">Entrar</button>
  </form>
</section>

<!-- LISTA -->
<section id="t-lista" class="oculto">
  <header class="topo">
    <h1>Carros na base</h1>
    <button class="btn btn-l" id="l-atualizar" type="button">Atualizar</button>
    <button class="btn btn-l" id="l-sair" type="button">Sair</button>
  </header>
  <div class="tela">
    <input class="busca" id="l-busca" type="search" placeholder="Procurar placa ou modelo" autocomplete="off">
    <div id="l-itens"></div>
  </div>
</section>

<!-- CÂMERA -->
<section id="t-camera" class="oculto">
  <video id="video" playsinline muted autoplay></video>
  <div class="flash" id="flash"></div>
  <div class="cam-topo">
    <div class="ico" id="cam-ico"></div>
    <div class="txt"><b id="cam-nome"></b><small id="cam-dica"></small></div>
    <button type="button" id="cam-pular">Pular</button>
  </div>
  <div class="cam-erro oculto" id="cam-erro"></div>
  <div class="cam-baixo">
    <button type="button" class="cam-ultima" id="cam-revisar" aria-label="Revisar as fotos"></button>
    <button type="button" class="disparo" id="cam-disparo" aria-label="Tirar foto"></button>
    <div class="cam-cont" id="cam-cont"></div>
  </div>
</section>

<!-- REVISÃO -->
<section id="t-revisao" class="oculto">
  <header class="topo">
    <button class="voltar" id="r-voltar" type="button" aria-label="Voltar para a lista">‹</button>
    <h1 id="r-titulo"></h1>
  </header>
  <div class="tela revisao">
    <h2 id="r-resumo"></h2>
    <p id="r-sub">Confira. Toque numa foto para refazer.</p>
    <div class="grade" id="r-grade"></div>
    <div class="acoes-fim">
      <button class="btn btn-s btn-grande" id="r-extra" type="button">📷 Foto extra (avaria, detalhe)</button>
      <button class="btn btn-v btn-grande" id="r-aprovar" type="button">Aprovar e enviar</button>
    </div>
  </div>
</section>

<input type="file" id="arquivo" accept="image/*" capture="environment" class="oculto">
<div class="recado oculto" id="recado"></div>

<script>
const SUPABASE_URL = "https://tbdeoytkiqhzadtbuazs.supabase.co";
const SUPABASE_KEY = "sb_publishable_uvgCHP3eaElSuhX7OEvPuw_gRywnPMs";
/* mesma sessão guardada do Pátio: quem é mandado de lá para cá não entra de novo */
const SESSAO = "prumo-sessao-v1";
const $ = s => document.querySelector(s);

/* As 8 fotos, na ordem de quem dá a volta no carro. x/y = onde a pessoa
   fica no desenho do carro visto de cima (frente para cima). */
const ANGULOS = [
  { id:"frente",   nome:"Frente",             dica:"Com a placa aparecendo",          x:50, y:6 },
  { id:"diag_de",  nome:"Dianteira esquerda", dica:"Quina da frente, lado motorista",  x:12, y:16 },
  { id:"diag_te",  nome:"Traseira esquerda",  dica:"Quina de trás, lado motorista",    x:12, y:84 },
  { id:"traseira", nome:"Traseira",           dica:"Com a placa aparecendo",          x:50, y:94 },
  { id:"diag_td",  nome:"Traseira direita",   dica:"Quina de trás, lado passageiro",   x:88, y:84 },
  { id:"diag_dd",  nome:"Dianteira direita",  dica:"Quina da frente, lado passageiro", x:88, y:16 },
  { id:"painel",   nome:"Painel ligado",      dica:"KM e luzes legíveis",             dentro:"painel" },
  { id:"interior", nome:"Bancos",             dica:"Da porta do motorista",            dentro:"bancos" }
];

let sessao = null, carros = [], carro = null;
/* fotos do carro aberto, ainda no aparelho até aprovar:
   ângulo → { blob, mini, url (prévia), estado: "nova"|"enviando"|"ok"|"erro" }
   ângulo já salvo antes vem como { estado:"salva" } (sem prévia) */
let fotos = {}, extras = [], atual = 0, voltarParaRevisao = false;
let fluxo = null, usandoArquivo = false;

/* ---------- sessão ---------- */
function guardarSessao(d){
  sessao = { token:d.access_token, renova:d.refresh_token, expira:Date.now() + (d.expires_in || 3600) * 1000,
    email:(d.user && d.user.email) || (sessao && sessao.email) || "" };
  try{ localStorage.setItem(SESSAO, JSON.stringify(sessao)); }catch(e){}
}
function lerSessao(){
  try{ const s = JSON.parse(localStorage.getItem(SESSAO) || "null"); return s && s.renova ? s : null; }catch(e){ return null; }
}
async function auth(caminho, corpo){
  const r = await fetch(SUPABASE_URL + "/auth/v1/" + caminho, { method:"POST",
    headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json" }, body:JSON.stringify(corpo) });
  const d = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(d.error_description || d.msg || "Erro " + r.status); e.recusado = r.status < 500; throw e; }
  return d;
}
let renovando = null;
async function token(){
  if(!sessao) throw new Error("sem sessão");
  if(Date.now() > sessao.expira - 60000){
    const g = lerSessao();                       // outra aba pode ter renovado antes
    if(g && g.expira > sessao.expira) sessao = g;
    if(Date.now() > sessao.expira - 60000){
      renovando = renovando || auth("token?grant_type=refresh_token", { refresh_token:sessao.renova })
        .then(guardarSessao).finally(() => renovando = null);
      try{ await renovando; }catch(e){ if(e.recusado) sair(); throw e; }
    }
  }
  return sessao.token;
}
async function api(caminho, opcoes){
  const t = await token();
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + caminho, Object.assign({}, opcoes, {
    headers: Object.assign({ apikey:SUPABASE_KEY, Authorization:"Bearer " + t, "Content-Type":"application/json" }, (opcoes || {}).headers || {}) }));
  if(!r.ok){
    const txt = await r.text();
    let msg = txt; try{ msg = JSON.parse(txt).message || txt; }catch(e){}
    throw new Error(msg.slice(0, 160));
  }
  const t2 = await r.text();
  return t2 ? JSON.parse(t2) : null;
}
function sair(){
  sessao = null;
  try{ localStorage.removeItem(SESSAO); }catch(e){}
  pararCamera();
  mostrar("entrar");
}

/* ---------- telas ---------- */
function mostrar(qual){
  ["entrar","lista","camera","revisao"].forEach(t => $("#t-" + t).classList.toggle("oculto", t !== qual));
  if(qual !== "camera") pararCamera();
  window.scrollTo(0, 0);
}
let tempoRecado = 0;
function recado(msg){
  const el = $("#recado");
  el.textContent = msg; el.classList.remove("oculto");
  clearTimeout(tempoRecado); tempoRecado = setTimeout(() => el.classList.add("oculto"), 3200);
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const placaHTML = p => '<span class="placa"><span class="br">BRASIL</span><span class="num">' + esc(p || "—") + '</span></span>';

/* ---------- entrar ---------- */
$("#f-entrar").onsubmit = async e => {
  e.preventDefault();
  $("#e-erro").textContent = ""; $("#e-botao").disabled = true;
  try{
    guardarSessao(await auth("token?grant_type=password", { email:$("#e-email").value.trim(), password:$("#e-senha").value }));
    await abrirLista();
  }catch(err){
    $("#e-erro").textContent = /invalid/i.test(err.message) ? "E-mail ou senha errados." : "Não entrou: " + err.message;
  }finally{ $("#e-botao").disabled = false; }
};

/* ---------- lista ---------- */
async function abrirLista(){
  mostrar("lista");
  $("#l-itens").innerHTML = '<div class="vazio">Carregando…</div>';
  try{
    carros = await api("rpc/fotos_pendentes", { method:"POST", body:"{}" }) || [];
    pintarLista();
  }catch(err){
    $("#l-itens").innerHTML = '<div class="vazio">' + (/permiss|jwt|401/i.test(err.message)
      ? "Este login não tem acesso ao modo fotos." : "Não carregou: " + esc(err.message)) +
      '<br><br><button class="btn btn-s" onclick="abrirLista()">Tentar de novo</button></div>';
  }
}
const feitas = c => ANGULOS.filter(a => (c.angulos || []).includes(a.id)).length;
function pintarLista(){
  const t = $("#l-busca").value.trim().toLowerCase().replace(/[^a-z0-9 ]/g, "");
  const l = carros.filter(c => !t || (String(c.placa || "") + " " + String(c.modelo || "")).toLowerCase().replace(/[^a-z0-9 ]/g, "").includes(t));
  if(!carros.length){ $("#l-itens").innerHTML = '<div class="vazio">Nenhum carro na base agora.</div>'; return; }
  if(!l.length){ $("#l-itens").innerHTML = '<div class="vazio">Nenhum carro com essa busca.</div>'; return; }
  const falta = l.filter(c => feitas(c) < ANGULOS.length), prontos = l.filter(c => feitas(c) >= ANGULOS.length);
  const item = c => {
    const f = feitas(c), ok = f >= ANGULOS.length;
    return '<button class="carro' + (ok ? " completo" : "") + '" data-id="' + c.id + '">' + placaHTML(c.placa) +
      '<span class="info"><div class="modelo">' + esc(c.modelo || "Modelo não informado") + '</div>' +
      '<div class="falta">' + (ok ? "✓ Fotos completas" : f ? "Faltam " + (ANGULOS.length - f) + " de " + ANGULOS.length : "Sem fotos") + '</div></span>' +
      '<span class="seta">›</span></button>';
  };
  $("#l-itens").innerHTML =
    (falta.length ? '<div class="secao">Falta foto · ' + falta.length + '</div>' + falta.map(item).join("") : "") +
    (prontos.length ? '<div class="secao">Prontos · ' + prontos.length + '</div>' + prontos.map(item).join("") : "");
}
$("#l-busca").oninput = pintarLista;
$("#l-atualizar").onclick = abrirLista;
$("#l-sair").onclick = sair;
$("#l-itens").onclick = e => {
  const b = e.target.closest(".carro");
  if(b) abrirCarro(carros.find(c => c.id === b.dataset.id));
};

/* ---------- abrir um carro: direto na câmera ---------- */
function abrirCarro(c){
  if(!c) return;
  carro = c; fotos = {}; extras = []; voltarParaRevisao = false;
  (c.angulos || []).forEach(a => { fotos[a] = { estado:"salva" }; });
  const prox = ANGULOS.findIndex(a => !fotos[a.id]);
  if(prox < 0){ abrirRevisao(); return; }          // já completo: só revisar/acrescentar
  abrirCamera(prox);
}

/* ícone pequeno: carro visto de cima com o ponto de onde tirar */
function icone(a){
  if(a.dentro === "painel") return '<svg viewBox="0 0 100 100"><rect x="6" y="26" width="88" height="48" rx="14" fill="none" stroke="currentColor" stroke-width="6"/>' +
    '<circle cx="34" cy="50" r="13" fill="none" stroke="#1F8F4E" stroke-width="6"/><circle cx="66" cy="50" r="13" fill="none" stroke="#1F8F4E" stroke-width="6"/></svg>';
  if(a.dentro === "bancos") return '<svg viewBox="0 0 100 100"><rect x="14" y="24" width="30" height="56" rx="10" fill="none" stroke="#1F8F4E" stroke-width="6"/>' +
    '<rect x="56" y="24" width="30" height="56" rx="10" fill="none" stroke="#1F8F4E" stroke-width="6"/></svg>';
  const ang = Math.atan2(50 - a.y, 50 - a.x), dx = Math.cos(ang) * 14, dy = Math.sin(ang) * 14;
  return '<svg viewBox="0 0 100 100"><rect x="34" y="20" width="32" height="60" rx="11" fill="none" stroke="currentColor" stroke-width="6"/>' +
    '<rect x="39" y="30" width="22" height="9" rx="3" fill="currentColor" opacity=".35"/>' +
    '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + (a.x + dx) + '" y2="' + (a.y + dy) + '" stroke="#1F8F4E" stroke-width="6" stroke-linecap="round"/>' +
    '<circle cx="' + a.x + '" cy="' + a.y + '" r="9" fill="#1F8F4E"/></svg>';
}

async function abrirCamera(indice){
  atual = indice;
  mostrar("camera");
  pintarCamera();
  if(fluxo || usandoArquivo) return;
  $("#cam-erro").classList.add("oculto");
  try{
    fluxo = await navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1920 }, height:{ ideal:1080 } } });
    const v = $("#video");
    v.srcObject = fluxo;
    await v.play().catch(() => {});
  }catch(err){
    /* sem câmera na página (permissão negada, navegador antigo): cai para a
       câmera do próprio celular, uma foto de cada vez */
    usandoArquivo = true;
    $("#cam-erro").innerHTML = "A câmera não abriu aqui dentro.<br>Toque no botão branco para abrir a câmera do celular.";
    $("#cam-erro").classList.remove("oculto");
  }
}
function pararCamera(){
  if(fluxo){ fluxo.getTracks().forEach(t => t.stop()); fluxo = null; }
  const v = $("#video"); if(v) v.srcObject = null;
}
function pintarCamera(){
  const a = atual === "extra" ? { nome:"Foto extra", dica:"Avaria ou detalhe", dentro:"extra" } : ANGULOS[atual];
  $("#cam-ico").innerHTML = a.dentro === "extra"
    ? '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="#C62828" stroke-width="7"/><line x1="50" y1="34" x2="50" y2="54" stroke="#C62828" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="66" r="5" fill="#C62828"/></svg>'
    : icone(a);
  $("#cam-nome").textContent = a.nome;
  $("#cam-dica").textContent = a.dica;
  $("#cam-pular").textContent = atual === "extra" || voltarParaRevisao ? "Cancelar" : "Pular";
  const n = ANGULOS.filter(x => fotos[x.id]).length;
  $("#cam-cont").textContent = (atual === "extra" ? "+" : (atual + 1)) + "/" + ANGULOS.length;
  const ultima = [...extras].reverse().concat(ANGULOS.map(x => fotos[x.id]).reverse()).find(f => f && f.url);
  $("#cam-revisar").innerHTML = ultima ? '<img src="' + ultima.url + '" alt="">' : "";
  $("#cam-revisar").style.visibility = n || extras.length ? "visible" : "hidden";
}
/* depois de cada foto: o próximo ângulo que falta; acabou → revisão */
function avancar(){
  if(voltarParaRevisao || atual === "extra"){ abrirRevisao(); return; }
  const prox = ANGULOS.findIndex((a, k) => k > atual && !fotos[a.id]);
  if(prox < 0){ abrirRevisao(); return; }
  atual = prox; pintarCamera();
}
$("#cam-pular").onclick = () => {
  if(atual === "extra" || voltarParaRevisao){ abrirRevisao(); return; }
  const prox = ANGULOS.findIndex((a, k) => k > atual && !fotos[a.id]);
  if(prox < 0){ abrirRevisao(); return; }
  atual = prox; pintarCamera();
};
$("#cam-revisar").onclick = abrirRevisao;
$("#cam-disparo").onclick = async () => {
  if(usandoArquivo || !fluxo){ $("#arquivo").value = ""; $("#arquivo").click(); return; }
  const v = $("#video");
  if(!v.videoWidth){ recado("A câmera ainda está abrindo…"); return; }
  /* clarão curto: dá a certeza de que a foto foi tirada */
  const fl = $("#flash"); fl.classList.add("ativo"); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove("ativo")));
  if(navigator.vibrate) navigator.vibrate(30);
  const tela = document.createElement("canvas");
  const e = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
  tela.width = Math.round(v.videoWidth * e); tela.height = Math.round(v.videoHeight * e);
  tela.getContext("2d").drawImage(v, 0, 0, tela.width, tela.height);
  guardarFoto(await paraBlob(tela, .7), await reduzir(tela, 360));
};
$("#arquivo").onchange = async e => {
  const arq = e.target.files && e.target.files[0];
  if(!arq) return;
  try{
    const img = await carregarImagem(arq);
    const tela = document.createElement("canvas");
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    tela.width = Math.round(img.width * k); tela.height = Math.round(img.height * k);
    const g = tela.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, tela.width, tela.height);
    g.drawImage(img, 0, 0, tela.width, tela.height);
    guardarFoto(await paraBlob(tela, .6), await reduzir(tela, 360));
  }catch(err){ recado("Não consegui ler a foto."); }
};
function guardarFoto(blob, mini){
  const f = { blob, mini, url:URL.createObjectURL(mini || blob), estado:"nova" };
  if(atual === "extra") extras.push(f);
  else{
    const velha = fotos[ANGULOS[atual].id];
    if(velha && velha.url) URL.revokeObjectURL(velha.url);
    fotos[ANGULOS[atual].id] = f;
  }
  avancar();
}
const paraBlob = (tela, q) => new Promise((ok, falha) => tela.toBlob(b => b ? ok(b) : falha(new Error("falha")), "image/jpeg", q));
function reduzir(tela, lado){
  const k = Math.min(1, lado / Math.max(tela.width, tela.height));
  const m = document.createElement("canvas");
  m.width = Math.round(tela.width * k); m.height = Math.round(tela.height * k);
  m.getContext("2d").drawImage(tela, 0, 0, m.width, m.height);
  return paraBlob(m, .6).catch(() => null);
}
function carregarImagem(arq){
  return new Promise((ok, falha) => {
    const u = URL.createObjectURL(arq), img = new Image();
    img.onload = () => { URL.revokeObjectURL(u); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(u); falha(new Error("imagem inválida")); };
    img.src = u;
  });
}

/* ---------- revisão e aprovação ---------- */
function abrirRevisao(){
  voltarParaRevisao = true;
  mostrar("revisao");
  pintarRevisao();
}
function pintarRevisao(){
  $("#r-titulo").innerHTML = esc(carro.placa || "") + ' <span style="font-weight:400;color:var(--tinta-2)">· ' + esc(carro.modelo || "") + '</span>';
  const novas = ANGULOS.filter(a => fotos[a.id] && fotos[a.id].blob).length + extras.filter(f => f.blob).length;
  const total = ANGULOS.filter(a => fotos[a.id]).length;
  $("#r-resumo").textContent = total + " de " + ANGULOS.length + " fotos" + (extras.length ? " + " + extras.length + " extra" + (extras.length > 1 ? "s" : "") : "");
  const selo = f => !f ? "" : f.estado === "ok" || f.estado === "salva" ? '<span class="selo ok">✓</span>'
    : f.estado === "enviando" ? '<span class="selo ind">…</span>' : f.estado === "erro" ? '<span class="selo err">!</span>' : "";
  $("#r-grade").innerHTML = ANGULOS.map((a, i) => {
    const f = fotos[a.id];
    if(f && f.url) return '<button class="foto" data-i="' + i + '"><img src="' + f.url + '" alt="">' + selo(f) +
      '<span class="refazer">Refazer</span><span class="rot">' + esc(a.nome) + '</span></button>';
    if(f && f.estado === "salva") return '<button class="foto vazia" data-i="' + i + '">' + selo(f) +
      '<span class="rot">' + esc(a.nome) + '<br><small>já enviada · tocar para refazer</small></span></button>';
    return '<button class="foto vazia" data-i="' + i + '"><span class="rot">📷 ' + esc(a.nome) + '<br><small>faltando</small></span></button>';
  }).join("") + extras.map((f, k) => '<button class="foto" data-x="' + k + '"><img src="' + f.url + '" alt="">' + selo(f) +
    '<span class="rot">Extra ' + (k + 1) + '</span></button>').join("");
  $("#r-grade").querySelectorAll("[data-i]").forEach(b => b.onclick = () => abrirCamera(Number(b.dataset.i)));
  $("#r-grade").querySelectorAll("[data-x]").forEach(b => b.onclick = () => {
    if(extras[b.dataset.x].estado === "ok") return;
    if(confirm("Tirar esta foto extra?")){ URL.revokeObjectURL(extras[b.dataset.x].url); extras.splice(Number(b.dataset.x), 1); pintarRevisao(); }
  });
  const ap = $("#r-aprovar");
  ap.disabled = !novas || enviandoTudo;
  ap.textContent = enviandoTudo ? "Enviando…" : novas ? "Aprovar e enviar " + novas + (novas > 1 ? " fotos" : " foto") : "Nada novo para enviar";
  $("#r-sub").textContent = novas ? "Confira. Toque numa foto para refazer." : "Toque num quadro para tirar ou refazer a foto.";
}
$("#r-extra").onclick = () => { abrirCamera("extra"); };
$("#r-voltar").onclick = () => {
  const pend = ANGULOS.some(a => fotos[a.id] && fotos[a.id].blob) || extras.some(f => f.blob);
  if(pend && !confirm("As fotos ainda não foram enviadas. Sair e perder?")) return;
  abrirLista();
};
let enviandoTudo = false;
$("#r-aprovar").onclick = async () => {
  const fila = ANGULOS.filter(a => fotos[a.id] && fotos[a.id].blob).map(a => [a.id, fotos[a.id]])
    .concat(extras.filter(f => f.blob).map(f => ["extra", f]));
  if(!fila.length) return;
  enviandoTudo = true;
  fila.forEach(([, f]) => f.estado = "enviando");
  pintarRevisao();
  /* duas por vez: rápido no 4G sem engasgar */
  let i = 0;
  const trabalhador = async () => {
    while(i < fila.length){
      const [ang, f] = fila[i++];
      try{ await enviarFoto(ang, f); f.estado = "ok"; delete f.blob; delete f.mini; }
      catch(err){ f.estado = "erro"; f.msg = err.message; }
      pintarRevisao();
    }
  };
  await Promise.all([trabalhador(), trabalhador()]);
  enviandoTudo = false;
  const erros = fila.filter(([, f]) => f.estado === "erro").length;
  if(erros){ recado(erros + (erros > 1 ? " fotos não subiram" : " foto não subiu") + ". Toque em Aprovar de novo."); fila.forEach(([, f]) => { if(f.estado === "erro") f.estado = "nova"; }); pintarRevisao(); return; }
  recado("Fotos enviadas ✓");
  carro.angulos = Array.from(new Set((carro.angulos || []).concat(fila.map(([a]) => a).filter(a => a !== "extra"))));
  setTimeout(abrirLista, 700);
};
async function enviarFoto(angulo, f){
  const nome = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
  const t = await token();
  const r = await fetch(SUPABASE_URL + "/storage/v1/object/fotos/" + nome + ".jpg", { method:"POST",
    headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer " + t, "Content-Type":"image/jpeg" }, body:f.blob });
  if(!r.ok) throw new Error("a foto não subiu (" + r.status + ")");
  /* a miniatura é o que o Pátio mostra na galeria; se falhar, ele usa a grande */
  if(f.mini) await fetch(SUPABASE_URL + "/storage/v1/object/fotos/" + nome + ".m.jpg", { method:"POST",
    headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer " + t, "Content-Type":"image/jpeg", "x-upsert":"true" }, body:f.mini }).catch(() => {});
  await api("rpc/registrar_foto", { method:"POST", body:JSON.stringify({
    p_veiculo:carro.id, p_angulo:angulo, p_url:SUPABASE_URL + "/storage/v1/object/public/fotos/" + nome + ".jpg" }) });
}
addEventListener("beforeunload", e => {
  if(ANGULOS.some(a => fotos[a.id] && fotos[a.id].blob) || extras.some(f => f.blob)){ e.preventDefault(); e.returnValue = ""; }
});
/* celular bloqueado com a câmera aberta: solta a câmera e pega de novo na volta */
document.addEventListener("visibilitychange", () => {
  if(document.hidden) pararCamera();
  else if(!$("#t-camera").classList.contains("oculto") && !usandoArquivo) abrirCamera(atual);
});

/* ---------- início ---------- */
sessao = lerSessao();
if(sessao) abrirLista(); else mostrar("entrar");
</script>
